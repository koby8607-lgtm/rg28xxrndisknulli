name: Build KNULLI RG28XX RNDIS Full Image

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout KNULLI
        uses: actions/checkout@v4
        with:
          repository: knulli-cfw/distribution
          ref: knulli-main
          fetch-depth: 1
          submodules: recursive

      - name: Validate KNULLI source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f buildroot/Makefile
          test -f configs/knulli-h700.board
          git submodule status --recursive
          test -f configs/createDefconfig.sh
          test -f board/batocera/allwinner/h700/linux-sunxi64-legacy.config
          echo "Verified required KNULLI H700 files are present."
          echo "Official board file: configs/knulli-h700.board"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev libelf-dev \
            ccache cmake device-tree-compiler dosfstools file gawk \
            graphviz imagemagick libglib2.0-dev libtool m4 mtools pigz \
            python3 rsync scons subversion texinfo u-boot-tools unzip \
            wget xdelta3 zip curl xz-utils

      - name: Prepare cache directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl buildroot-ccache
          echo "DL_DIR=$GITHUB_WORKSPACE/dl"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/buildroot-ccache"

      - name: Ensure KNULLI submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f buildroot/Makefile
          echo "Buildroot submodule is present."

      - name: Restore Buildroot source cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: knulli-rg28xx-dl-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            knulli-rg28xx-dl-${{ github.ref_name }}-
            knulli-rg28xx-dl-

      - name: Restore Buildroot compiler cache
        uses: actions/cache/restore@v4
        with:
          path: buildroot-ccache
          key: knulli-rg28xx-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            knulli-rg28xx-ccache-${{ github.ref_name }}-
            knulli-rg28xx-ccache-

      - name: Pre-seed fontconfig 2.15.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/dl/fontconfig-2.15.0.tar.xz"

          if [ -s "$archive" ]; then
            echo "fontconfig-2.15.0.tar.xz already present."
          else
            echo "Downloading fontconfig-2.15.0.tar.xz from fallback mirror..."
            curl -fL --retry 10 --retry-delay 5 \
              "https://dev-www.libreoffice.org/src/fontconfig-2.15.0.tar.xz" \
              -o "$archive"
          fi

          test -s "$archive"
          file "$archive"
          ls -lh "$archive"

      - name: Create RG28XX build target from official H700 board
        shell: bash
        run: |
          set -euo pipefail

          # Current KNULLI main exposes the H700 board as
          # configs/knulli-h700.board. There is no official
          # configs/knulli-h700-rg28xx.board file in the current tree.
          # The previous workflow incorrectly required that nonexistent file.
          cp configs/knulli-h700.board configs/knulli-h700-rg28xx-rndis.board

          test -s configs/knulli-h700-rg28xx-rndis.board

          echo "Created: configs/knulli-h700-rg28xx-rndis.board"
          grep -E '^(BR2_PACKAGE_BATOCERA_TARGET_H700|BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION|BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE)=' \
            configs/knulli-h700-rg28xx-rndis.board

          echo "Checking that KNULLI recognises the custom target..."
          make vars | grep -q 'h700-rg28xx-rndis'
          echo "Target is recognised by KNULLI Makefile."

      - name: Enable built-in RNDIS kernel support
        shell: bash
        run: |
          set -euo pipefail

          config='board/batocera/allwinner/h700/linux-sunxi64-legacy.config'
          test -s "$config"

          # Remove existing assignments so each option has exactly one final value.
          sed -i \
            -e '/^CONFIG_NETDEVICES=/d' \
            -e '/^# CONFIG_NETDEVICES is not set$/d' \
            -e '/^CONFIG_USB_NET_DRIVERS=/d' \
            -e '/^# CONFIG_USB_NET_DRIVERS is not set$/d' \
            -e '/^CONFIG_USB_USBNET=/d' \
            -e '/^# CONFIG_USB_USBNET is not set$/d' \
            -e '/^CONFIG_USB_NET_CDCETHER=/d' \
            -e '/^# CONFIG_USB_NET_CDCETHER is not set$/d' \
            -e '/^CONFIG_USB_NET_RNDIS_HOST=/d' \
            -e '/^# CONFIG_USB_NET_RNDIS_HOST is not set$/d' \
            -e '/^CONFIG_MII=/d' \
            -e '/^# CONFIG_MII is not set$/d' \
            "$config"

          printf '%s\n' \
            '# RG28XX USB tethering / RNDIS' \
            'CONFIG_NETDEVICES=y' \
            'CONFIG_USB_NET_DRIVERS=y' \
            'CONFIG_USB_USBNET=y' \
            'CONFIG_USB_NET_CDCETHER=y' \
            'CONFIG_USB_NET_RNDIS_HOST=y' \
            'CONFIG_MII=y' >> "$config"

          echo "Final kernel input settings:"
          grep -E '^CONFIG_(NETDEVICES|USB_NET_DRIVERS|USB_USBNET|USB_NET_CDCETHER|USB_NET_RNDIS_HOST|MII)=' "$config"

      - name: Verify RNDIS source and required USB options are present
        shell: bash
        run: |
          set -euo pipefail

          # The exact KNULLI H700 board uses this Orange Pi BSP branch.
          # Verify the source branch directly without cloning it a second time.
          grep -q 'BR2_LINUX_KERNEL_CUSTOM_REPO_URL="https://github.com/orangepi-xunlong/linux-orangepi.git"' \
            configs/knulli-h700-rg28xx-rndis.board
          grep -q 'BR2_LINUX_KERNEL_CUSTOM_REPO_VERSION="orange-pi-4.9-sun50iw9"' \
            configs/knulli-h700-rg28xx-rndis.board

          echo "Kernel source: Orange Pi linux-orangepi orange-pi-4.9-sun50iw9"
          echo "RNDIS workaround is supplied by that BSP branch; no duplicate patch is applied."

      - name: Generate KNULLI defconfig
        shell: bash
        run: |
          set -euo pipefail
          ./configs/createDefconfig.sh configs/knulli-h700-rg28xx-rndis
          test -s configs/knulli-h700-rg28xx-rndis_defconfig
          echo "Generated defconfig successfully."

      - name: Configure target before full build
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 \
            DL_DIR="$GITHUB_WORKSPACE/dl" \
            CCACHE_DIR="$GITHUB_WORKSPACE/buildroot-ccache" \
            h700-rg28xx-rndis-config
          test -s output/h700-rg28xx-rndis/.config
          echo "Buildroot target configuration completed successfully."

      - name: Verify resolved kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          kernel_config='board/batocera/allwinner/h700/linux-sunxi64-legacy.config'
          grep -q '^CONFIG_USB_USBNET=y$' "$kernel_config"
          grep -q '^CONFIG_USB_NET_CDCETHER=y$' "$kernel_config"
          grep -q '^CONFIG_USB_NET_RNDIS_HOST=y$' "$kernel_config"
          echo "RNDIS kernel configuration verified before full build."

      - name: Build complete KNULLI image
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 \
            DL_DIR="$GITHUB_WORKSPACE/dl" \
            CCACHE_DIR="$GITHUB_WORKSPACE/buildroot-ccache" \
            h700-rg28xx-rndis-build

      - name: Verify final image and final kernel config
        shell: bash
        run: |
          set -euo pipefail

          echo "Images produced:"
          find output/h700-rg28xx-rndis/images -type f \
            \( -name '*.img.gz' -o -name '*.img' \) -print

          image="$(find output/h700-rg28xx-rndis/images -type f -name '*.img.gz' | head -n 1)"
          test -n "$image"

          kernel_config="$(find output/h700-rg28xx-rndis/build -maxdepth 2 -type f -path '*/linux-*/.config' | head -n 1)"
          test -n "$kernel_config"

          grep -q '^CONFIG_USB_USBNET=y$' "$kernel_config"
          grep -q '^CONFIG_USB_NET_CDCETHER=y$' "$kernel_config"
          grep -q '^CONFIG_USB_NET_RNDIS_HOST=y$' "$kernel_config"

          echo
          echo "FINAL IMAGE: $image"
          ls -lh "$image"

      - name: Collect final image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          find output/h700-rg28xx-rndis/images -type f \
            \( -name '*.img.gz' -o -name '*.img' \) \
            -exec cp -v {} artifacts/ \
            ;
          ls -lh artifacts

      - name: Save Buildroot source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: knulli-rg28xx-dl-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save Buildroot compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-ccache
          key: knulli-rg28xx-ccache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload complete image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rg28xx-rndis-full-image
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rg28xx-rndis-failure-diagnostics
          path: output/h700-rg28xx-rndis/
          if-no-files-found: ignore
