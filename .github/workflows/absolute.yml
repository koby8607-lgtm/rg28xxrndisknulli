name: Build KNULLI RG28XX RNDIS Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DL_DIR: ${{ github.workspace }}/dl
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache rsync unzip bc libncurses-dev git wget curl

      - name: Prepare build directories
        run: |
          mkdir -p "$DL_DIR" "$CCACHE_DIR" "$OUTPUT_DIR"

      - name: Extract Linux kernel source
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 DL_DIR="$DL_DIR" CCACHE_DIR="$CCACHE_DIR" linux-extract

      - name: Apply Orange Pi Android RNDIS fallback patch
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR="$(find "$OUTPUT_DIR/h700-rg28xx-rndis/build" -maxdepth 1 -type d -name 'linux-*' -print | sort | sed -n '1p')"
          test -n "$KERNEL_DIR"
          
          echo "Patching cdc_ether.c in $KERNEL_DIR..."
          curl -fsSL "https://raw.githubusercontent.com/orangepi-xunlong/linux-orangepi/orange-pi-4.9-sun50iw9/drivers/net/usb/cdc_ether.c" \
            -o "$KERNEL_DIR/drivers/net/usb/cdc_ether.c"
          
          grep -q 'android_rndis_quirk' "$KERNEL_DIR/drivers/net/usb/cdc_ether.c"
          echo "Android RNDIS driver successfully injected."

      - name: Generate base kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 DL_DIR="$DL_DIR" CCACHE_DIR="$CCACHE_DIR" linux-configure

      - name: Enable RNDIS USB Host Kernel Configs
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR="$(find "$OUTPUT_DIR/h700-rg28xx-rndis/build" -maxdepth 1 -type d -name 'linux-*' -print | sort | sed -n '1p')"
          test -n "$KERNEL_DIR"
          CONFIG_FILE="$KERNEL_DIR/.config"
          test -f "$CONFIG_FILE"

          echo "Enabling RNDIS options in $CONFIG_FILE..."
          "$KERNEL_DIR/scripts/config" --file "$CONFIG_FILE" --enable CONFIG_USB_USBNET
          "$KERNEL_DIR/scripts/config" --file "$CONFIG_FILE" --enable CONFIG_USB_NET_CDCETHER
          "$KERNEL_DIR/scripts/config" --file "$CONFIG_FILE" --enable CONFIG_USB_NET_RNDIS_HOST

          # Verify configuration flags exist in .config
          grep -E "CONFIG_USB_USBNET=y|CONFIG_USB_NET_CDCETHER=y|CONFIG_USB_NET_RNDIS_HOST=y" "$CONFIG_FILE"
          echo "RNDIS kernel configuration successfully set."

      - name: Extract pygame2 source before full build
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 DL_DIR="$DL_DIR" CCACHE_DIR="$CCACHE_DIR" python-pygame2-extract

      - name: Apply pygame2 GCC pragma fix
        shell: bash
        run: |
          set -euo pipefail
          PYGAME_DIR="$(find "$OUTPUT_DIR/h700-rg28xx-rndis/build" -maxdepth 1 -type d -name 'python-pygame2-*' -print | sort | sed -n '1p')"
          test -n "$PYGAME_DIR"

          HEADER="$PYGAME_DIR/src_c/include/sse2neon.h"
          test -f "$HEADER"

          if grep -q '^#pragma GCC pop_options$' "$HEADER"; then
            sed -i '/^#pragma GCC pop_options$/d' "$HEADER"
          fi
          echo "pygame2 GCC pragma fix verified."

      - name: Execute full build process
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 DL_DIR="$DL_DIR" CCACHE_DIR="$CCACHE_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rg28xx-rndis-images
          path: |
            output/h700-rg28xx-rndis/images/boot.img
            output/h700-rg28xx-rndis/images/*.img
