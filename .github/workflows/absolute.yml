name: Build KNULLI RG28XX RNDIS Full Image

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DL_DIR: ${{ github.workspace }}/dl
      CCACHE_DIR: ${{ github.workspace }}/ccache
      OUTPUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Checkout KNULLI
        uses: actions/checkout@v4
        with:
          repository: knulli-cfw/distribution
          ref: knulli-main
          fetch-depth: 1
          submodules: recursive

      - name: Initialize submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          test -f buildroot/Makefile
          echo "Buildroot submodule is ready."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev libelf-dev \
            ccache cmake device-tree-compiler dosfstools file gawk \
            graphviz imagemagick libglib2.0-dev libtool m4 mtools \
            pigz python3 rsync scons subversion texinfo u-boot-tools \
            unzip wget xdelta3 zip curl xz-utils gcc-multilib g++-multilib

      - name: Restore Buildroot downloads cache
        uses: actions/cache@v4
        with:
          path: dl
          key: knulli-rg28xx-dl-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            knulli-rg28xx-dl-${{ github.ref_name }}-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache
          key: knulli-rg28xx-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            knulli-rg28xx-ccache-${{ github.ref_name }}-

      - name: Prepare download and compiler cache directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DL_DIR" "$CCACHE_DIR"

      - name: Pre-download fontconfig 2.15.0
        shell: bash
        run: |
          set -euo pipefail
          FILE="$DL_DIR/fontconfig-2.15.0.tar.xz"
          if [ ! -s "$FILE" ]; then
            curl -fL --retry 10 --retry-delay 5 \
              "https://dev-www.libreoffice.org/src/fontconfig-2.15.0.tar.xz" \
              -o "$FILE"
          fi
          test -s "$FILE"
          echo "fontconfig archive ready:"
          ls -lh "$FILE"

      - name: Verify H700 board and config
        shell: bash
        run: |
          set -euo pipefail
          test -f configs/knulli-h700.board
          test -f board/batocera/allwinner/h700/linux-sunxi64-legacy.config
          echo "Official KNULLI H700 board/config found."

      - name: Create RG28XX RNDIS board target
        shell: bash
        run: |
          set -euo pipefail
          cp configs/knulli-h700.board configs/knulli-h700-rg28xx-rndis.board
          test -f configs/knulli-h700-rg28xx-rndis.board

      - name: Enable built-in USB RNDIS support
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="board/batocera/allwinner/h700/linux-sunxi64-legacy.config"

          sed -i \
            -e '/^CONFIG_NETDEVICES=/d' \
            -e '/^# CONFIG_NETDEVICES is not set$/d' \
            -e '/^CONFIG_USB_NET_DRIVERS=/d' \
            -e '/^# CONFIG_USB_NET_DRIVERS is not set$/d' \
            -e '/^CONFIG_USB_USBNET=/d' \
            -e '/^# CONFIG_USB_USBNET is not set$/d' \
            -e '/^CONFIG_USB_NET_CDCETHER=/d' \
            -e '/^# CONFIG_USB_NET_CDCETHER is not set$/d' \
            -e '/^CONFIG_USB_NET_RNDIS_HOST=/d' \
            -e '/^# CONFIG_USB_NET_RNDIS_HOST is not set$/d' \
            -e '/^CONFIG_MII=/d' \
            -e '/^# CONFIG_MII is not set$/d' \
            "$CONFIG"

          printf "\n# RG28XX USB tethering / RNDIS\nCONFIG_NETDEVICES=y\nCONFIG_USB_NET_DRIVERS=y\nCONFIG_USB_USBNET=y\nCONFIG_USB_NET_CDCETHER=y\nCONFIG_USB_NET_RNDIS_HOST=y\nCONFIG_MII=y\n" >> "$CONFIG"

          grep -E \
            'CONFIG_(NETDEVICES|USB_NET_DRIVERS|USB_USBNET|USB_NET_CDCETHER|USB_NET_RNDIS_HOST|MII)=' \
            "$CONFIG"

      - name: Verify Orange Pi Android RNDIS fallback source
        shell: bash
        run: |
          set -euo pipefail
          SRC_URL="https://raw.githubusercontent.com/orangepi-xunlong/linux-orangepi/orange-pi-4.9-sun50iw9/drivers/net/usb/cdc_ether.c"
          curl -fsSL "$SRC_URL" -o /tmp/cdc_ether.c
          grep -q 'android_rndis_quirk' /tmp/cdc_ether.c
          grep -q 'usb_ifnum_to_if(dev->udev, 0)' /tmp/cdc_ether.c
          grep -q 'usb_ifnum_to_if(dev->udev, 1)' /tmp/cdc_ether.c
          echo "Android RNDIS fallback confirmed in the exact Orange Pi BSP source."

      - name: Generate KNULLI defconfig
        shell: bash
        run: |
          set -euo pipefail
          ./configs/createDefconfig.sh ./configs/knulli-h700-rg28xx-rndis

      - name: Configure Buildroot target
        shell: bash
        run: |
          set -euo pipefail
          make DIRECT_BUILD=1 h700-rg28xx-rndis-config

      - name: Extract pygame2 source before full build
        shell: bash
        run: |
          set -euo pipefail
          make -C buildroot \
            O="$OUTPUT_DIR/h700-rg28xx-rndis" \
            BR2_EXTERNAL="$PWD" \
            BR2_DL_DIR="$DL_DIR" \
            python-pygame2-extract

      - name: Apply exact pygame2 GCC pragma fix
        shell: bash
        run: |
          set -euo pipefail

          PYGAME_DIR="$(find "$OUTPUT_DIR/h700-rg28xx-rndis/build" \
            -maxdepth 1 -type d -name 'python-pygame2-*' -print | sort | sed -n '1p')"

          test -n "$PYGAME_DIR"

          HEADER="$PYGAME_DIR/src_c/include/sse2neon.h"
          test -f "$HEADER"

          echo "Pygame source: $PYGAME_DIR"
          echo "Header: $HEADER"

          # Pygame 2.5.2 leaves the GCC push_options block commented out
          # but still emits a final pop_options. GCC treats that unmatched
          # pragma as -Werror=pragmas with the toolchain used by this build.
          if grep -q '^#pragma GCC pop_options$' "$HEADER"; then
            sed -i '/^#pragma GCC pop_options$/d' "$HEADER"
          fi

          if grep -q '^#pragma GCC pop_options$' "$HEADER"; then
            echo "ERROR: pygame pragma fix did not apply."
            exit 1
          fi

          echo "pygame2 GCC pragma fix applied successfully."

      - name: Build full KNULLI RG28XX image
        shell: bash
        run: |
          set -euo pipefail
          make \
            DIRECT_BUILD=1 \
            DL_DIR="$DL_DIR" \
            CCACHE_DIR="$CCACHE_DIR" \
            h700-rg28xx-rndis-build

      - name: Verify final image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' IMAGES < <(find "$OUTPUT_DIR/h700-rg28xx-rndis/images" \
            -type f -name '*.img.gz' -print0)

          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "ERROR: No final .img.gz image was produced."
            exit 1
          fi

          printf 'Generated image(s):\n'
          printf '%s\n' "${IMAGES[@]}"
          sha256sum "${IMAGES[@]}"

      - name: Collect final images only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts

          find "$OUTPUT_DIR/h700-rg28xx-rndis/images" \
            -type f \
            -name '*.img.gz' \
            -exec cp -v {} artifacts/ \;

          test -n "$(find artifacts -type f -name '*.img.gz' -print -quit)"
          ls -lh artifacts

      - name: Upload final image only
        uses: actions/upload-artifact@v4
        with:
          name: knulli-rg28xx-rndis-full-image
          path: artifacts/*.img.gz
          if-no-files-found: error
          compression-level: 0

      - name: Save caches for future runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            ccache
          key: knulli-postrun-${{ github.run_id }}
